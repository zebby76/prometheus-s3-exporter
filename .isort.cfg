# Read by both the local tooling and super-linter, which invokes
# `isort --sp <this file>` and would otherwise fall back to its own bundled
# config. That fallback pins src_paths outside the repository, so `exporter`
# stops being recognised as a local package and the two environments disagree
# on where its imports belong. known_first_party settles it explicitly.
[settings]
profile = black
known_first_party = exporter
# Vendored at the repository root, so it would otherwise be detected as a
# local package once src_paths points here.
known_third_party = versioneer
# Generated by versioneer, and excluded from linting in the workflow too.
extend_skip = _version.py,versioneer.py
