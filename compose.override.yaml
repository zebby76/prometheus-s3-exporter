---
services:
  exporter:
    build:
      context: .
      target: dev
    environment:
      # Keeps the smoke test's outage-and-recovery path down to seconds; the
      # shipped default is 60. Override from the shell to try other values,
      # including 0 to switch the probe off.
      - COLLECTOR_CONNECTIVITY_INTERVAL=${COLLECTOR_CONNECTIVITY_INTERVAL:-5}
    # Gate on the fixtures being in place: `up --wait` then means the bucket is
    # already populated, so the smoke test can assert on exact figures instead
    # of racing the uploads.
    depends_on:
      seaweedfs:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  # Creates the bucket and uploads test/assets through the S3 API, signed with
  # the exporter's key pair, then exits.
  s3-init:
    image: docker.io/amazon/aws-cli:2.37.5
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=s3admin
      - AWS_SECRET_ACCESS_KEY=s3admin-secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://seaweedfs:8333
    volumes:
      - ./test/assets:/data-to-upload:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws s3 mb s3://my-bucket
        aws s3 cp --recursive --only-show-errors /data-to-upload/ s3://my-bucket/
