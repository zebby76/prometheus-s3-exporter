---
services:
  exporter:
    image: docker.io/smalswebtech/prometheus-s3-exporter
    restart: unless-stopped
    environment:
      - OPENSHIFT_NODE_HOSTNAME=node1.openshift.cloud.vm
      - OPENSHIFT_NAMESPACE=default-namespace
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET_NAME=my-bucket
    user: "1002:0"
    ports:
      - 9773:9773/tcp
      - 9774:9774/tcp
    volumes:
      - ./config/collector.yml:/app/config/collector.yml
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9734/health"]
    mem_limit: 64m

  minio:
    image: docker.io/minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 512m

volumes:
  minio-data:
