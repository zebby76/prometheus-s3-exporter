---
services:
  exporter:
    image: docker.io/smalswebtech/prometheus-s3-exporter
    restart: unless-stopped
    environment:
      - OPENSHIFT_NAMESPACE=default-namespace
      - AWS_ACCESS_KEY_ID=s3admin
      - AWS_SECRET_ACCESS_KEY=s3admin-secret
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://seaweedfs:8333
      - S3_BUCKET_NAME=my-bucket
    user: "1001:0"
    ports:
      - 9773:9773/tcp
      - 9774:9774/tcp
    volumes:
      - ./config/collector.yml:/app/config/collector.yml
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request as u;
          u.urlopen('http://localhost:9774/healthz', timeout=4)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    mem_limit: 64m

  # S3 storage for local runs and the smoke test. SeaweedFS replaced MinIO,
  # whose images can no longer be pulled. It creates an admin identity from
  # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY: requests signed with any other key,
  # or unsigned, are refused. The `minio` usage source has nothing to read here,
  # so `auto` settles on the listing, as it did with MinIO unless sources.minio
  # was filled in.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=s3admin
      - AWS_SECRET_ACCESS_KEY=s3admin-secret
    volumes:
      - seaweedfs-data:/data
    command: server -dir=/data -s3 -ip.bind=0.0.0.0
    healthcheck:
      # /status on the S3 port answers once the gateway serves requests.
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

volumes:
  seaweedfs-data:
