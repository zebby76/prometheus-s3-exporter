---
kind: PrometheusExporterConfig
configuration:
  # Minutes between two collections.
  - interval: 1

  # Where the usage figures come from.
  #   auto        detect at startup: storagegrid, minio, cloudwatch, r2, then list
  #   storagegrid GET /<bucket>?x-ntap-sg-usage  (1 request, S3 credentials)
  #   minio       MinIO Prometheus endpoint      (1 request, needs sources.minio)
  #   cloudwatch  AWS/S3 daily storage metrics   (1 request, needs sources.cloudwatch)
  #   r2          Cloudflare R2 account API      (1 request, needs sources.r2)
  #   list        ListObjectsV2                  (1 request per 1000 objects)
  # Overridable at runtime with the COLLECTOR_SOURCE environment variable.
  - source: auto

  # Consecutive collection failures before the source is detected again.
  - max_failures: 3

  # Seconds between two bucket reachability probes, on their own thread and
  # their own clock. One cheap request each, so this can stay frequent even
  # when `interval` is measured in hours. 0 disables the probe and /readyz.
  # Overridable with COLLECTOR_CONNECTIVITY_INTERVAL.
  #
  # Keep this under the idle timeout of whatever sits in front of the storage
  # system. Between two collections the probe is the only traffic on its
  # connection, so this interval is also what keeps that connection alive; set
  # equal to the idle timeout it lands on the boundary and reconnects on about
  # every other cycle.
  - connectivity_interval: 30

  # Seconds allowed for one connectivity probe, for connect and for read alike.
  # Clamped to a quarter of `connectivity_interval`, so a whole check -- two
  # attempts of connect plus read -- always fits inside one cycle. botocore
  # retries are off: its backoff sleeps a random fraction of a second that would
  # be recorded as latency. The probe retries once itself, immediately.
  - probe_timeout: 5

  # Headers the access log reads for its four correlation fields, so the
  # exporter's lines join the reverse proxy's on the same request. Name only the
  # ones your proxy stamps differently; the rest keep the defaults below. Each is
  # overridable on its own with COLLECTOR_PROXY_HEADER_VIA, _VXID, _XFF, _PROTO.
  - proxy_headers:
      via: Via
      vxid: X-Transaction-Id
      xff: X-Forwarded-For
      proto: X-Forwarded-Proto

  # Seconds before retrying a failed collection, capped at `interval`. Without
  # it, one transient failure at a 60 minute interval leaves the figures stale
  # for a full hour.
  - retry_interval: 300

  # Per-source settings. minio and cloudwatch stay inactive until configured,
  # because both need credentials beyond the S3 key pair the exporter uses.
  - sources:
      # minio:
      #   # Answers 403 unless the operator sets MINIO_PROMETHEUS_AUTH_TYPE=public
      #   # or you supply a JWT minted from admin credentials.
      #   metrics_url: http://minio:9000/minio/v2/metrics/bucket
      #   bearer_token_file: /run/secrets/minio-metrics-token
      # cloudwatch:
      #   # Requires cloudwatch:GetMetricStatistics in the IAM policy.
      #   region: eu-west-1
      #   storage_type: StandardStorage
      # r2:
      #   # Cloudflare's account API, NOT the S3 endpoint: it needs an API token
      #   # with `Workers R2 Storage: Read`, which an S3 key pair cannot replace.
      #   # Both settings also read the environment (CF_ACCOUNT_ID, CF_API_TOKEN,
      #   # CF_R2_JURISDICTION) so one shared config file can serve several buckets.
      #   account_id: <cloudflare account id>
      #   api_token_file: /run/secrets/r2-usage-token
      #   # Only for a bucket created in a jurisdiction (eu, fedramp): without it
      #   # the API answers 404 rather than a wrong figure.
      #   jurisdiction: eu
