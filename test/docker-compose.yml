version: "2"

services:
  minio:
    image: docker.io/minio/minio:latest
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=${BATS_S3_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${BATS_S3_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - default
    mem_limit: 512m

  exporter:
    image: ${BATS_DOCKER_IMAGE_NAME}
    container_name: exporter
    environment:
      - OPENSHIFT_NODE_HOSTNAME=node1.openshift.cloud.vm
      - OPENSHIFT_NAMESPACE=${BATS_OPENSHIFT_NAMESPACE}
      - AWS_ACCESS_KEY_ID=${BATS_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BATS_S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${BATS_S3_DEFAULT_REGION}
      - AWS_ENDPOINT_URL=${BATS_S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${BATS_S3_BUCKET_NAME}
    ports:
      - 9773:9773
    networks:
      - default
    mem_limit: 64m

networks:
  default:
    external:
      name: docker_default
