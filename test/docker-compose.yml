version: "2"

services:
  s3:
    image: docker.io/localstack/localstack:0.8.8
    container_name: s3
    ports:
      - 4572:4572
    environment:
      - SERVICES=s3
      - DEBUG=true
      - DATA_DIR=/tmp/localstack/data
      - PORT_WEB_UI=8080
    networks:
      - default
    mem_limit: 512m

  exporter:
    image: ${BATS_EXPORTER_DOCKER_IMAGE_NAME}
    container_name: exporter
    environment:
      - OPENSHIFT_NODE_HOSTNAME=node1.openshift.cloud.vm
      - OPENSHIFT_NAMESPACE=default-namespace
      - AWS_ACCESS_KEY_ID=${BATS_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BATS_S3_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${BATS_S3_DEFAULT_REGION}
      - AWS_ENDPOINT_URL=${BATS_S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${BATS_S3_BUCKET_NAME}
    ports:
      - 9773:9773
    networks:
      - default
    build:
      context: .
      args:
        VERSION_ARG: ${DOCKER_IMAGE_VERSION}
        BUILD_DATE_ARG: ${BUILD_DATE}
        RELEASE_ARG: ${RELEASE_NUMBER}
        VCS_REF_ARG: ${VCS_REF}
        AWS_CLI_VERSION_ARG: ${AWS_CLI_VERSION}
    mem_limit: 128m

networks:
  default:
    external:
      name: docker_default
