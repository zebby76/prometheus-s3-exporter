# What an OpenShift pod in namespace `demo` gets: the cluster DNS service and
# its search list, with ndots:5. Mounted over the container's /etc/resolv.conf
# so queries skip Docker's embedded resolver (which answers SERVFAIL on its own
# after a few seconds and would hide the client's real timeout behaviour) and go
# to dnsfault, then CoreDNS. The address is fixed in compose.yaml.
nameserver 172.31.53.53
search demo.svc.cluster.local svc.cluster.local cluster.local
options ndots:5
