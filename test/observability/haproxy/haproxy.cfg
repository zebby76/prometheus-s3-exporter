# The load balancer in front of the storage, as in production. What matters
# here is the client-side idle timeout: it is what closes the probe's
# keep-alive connection, and only a new connection resolves the endpoint name
# again. LB_IDLE_TIMEOUT sets it (make obs/chaos/lb-idle IDLE=25s).
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client "${LB_IDLE_TIMEOUT}"
    timeout http-keep-alive "${LB_IDLE_TIMEOUT}"
    timeout server 120s

# Re-resolve the backend at runtime, so a stopped then restarted SeaweedFS
# comes back without restarting the balancer.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend s3
    # LB_BIND_PORT moves the listener away (make obs/chaos/lb-refuse): the
    # address still answers, with a reset, as a balancer with no listener does.
    bind ":${LB_BIND_PORT}"
    default_backend seaweedfs

backend seaweedfs
    # Health-checked: with the storage stopped, the balancer answers 503 at
    # once, which is what a client then sees.
    option httpchk GET /status
    server s1 seaweedfs:8333 resolvers docker init-addr last,libc,none check inter 2s
